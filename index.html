<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juegoteca</title>
<style>
:root{--bg:#120e1c;--estante:#2a1d14;--txt:#f5f1ff;--sub:#b3abcc;--acc:#ffc23d;--chip:#2c2540}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:20px 16px 6px;text-align:center;position:relative}
.cartel{display:inline-block;padding:6px 18px;border:3px solid var(--acc);border-radius:10px;box-shadow:0 0 18px #ffc23d66,inset 0 0 12px #ffc23d33}
h1{margin:0;font-size:2.1rem;letter-spacing:2px;text-transform:uppercase;color:var(--acc);text-shadow:0 0 10px #ffc23d88}
header p{margin:8px 0 0;color:var(--sub)}
.btnqr{margin-top:12px;border:0;border-radius:999px;padding:10px 18px;background:var(--acc);color:#1b1400;font-weight:700;font-size:1rem}
.filtros{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px 16px 6px}
.filtros button{border:0;border-radius:999px;padding:8px 14px;background:var(--chip);color:var(--txt);font-size:.95rem}
.filtros button.on{background:var(--acc);color:#1b1400;font-weight:600}
.cant{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--sub);padding:4px 16px 12px}
.cant input{width:64px;padding:6px;border-radius:8px;border:0;background:var(--chip);color:var(--txt);font-size:1rem}
main{display:grid;gap:22px 14px;padding:12px 16px 32px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));max-width:1100px;margin:0 auto;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(100% - 0px));}
/* caja */
.caja{perspective:900px;cursor:pointer;aspect-ratio:2/3;position:relative}
.caja::after{content:"";position:absolute;left:-8px;right:-8px;bottom:-12px;height:10px;background:var(--estante);border-radius:3px;box-shadow:0 4px 8px #0008}
.giro{position:absolute;inset:0;transition:transform .6s;transform-style:preserve-3d}
.caja.vuelta .giro{transform:rotateY(180deg)}
.cara{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px;overflow:hidden;box-shadow:4px 6px 14px #000a}
.frente{display:flex;flex-direction:column;padding:8px 8px 10px 20px}
.frente::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,#ffffff14 0 10px,transparent 10px 22px)}
.lomo{position:absolute;left:0;top:0;bottom:0;width:14px;background:#000c;display:flex;align-items:center;justify-content:center}
.lomo span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:.55rem;letter-spacing:2px;color:var(--acc);font-weight:700}
.top{display:flex;justify-content:space-between;align-items:flex-start;position:relative}
.calif{width:38px;height:38px;border-radius:50%;background:#fff;color:#111;font-weight:900;font-size:.8rem;display:flex;align-items:center;justify-content:center;border:3px solid #111}
.calif.mas{background:#ffd23f}.calif.mas16{background:#ff8c3a}.calif.mas18{background:#e8413b;color:#fff}
.jug{background:#000b;color:#fff;border-radius:6px;padding:4px 6px;font-size:.72rem;font-weight:700}
.ilus{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
.ilus div{font-size:3.6rem;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle,#ffffff55,#ffffff10 70%);display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 4px 6px #0006)}
.titulo{position:relative;font-weight:900;text-transform:uppercase;font-size:1.05rem;line-height:1.05;color:#fff;text-shadow:2px 2px 0 #000a;word-break:break-word}
.lema{position:relative;font-size:.68rem;color:#fffd;margin-top:4px;font-style:italic}
.dorso{transform:rotateY(180deg);background:#f4efe3;color:#222;padding:12px;display:flex;flex-direction:column;gap:8px}
.dorso h2{margin:0;font-size:1rem;text-transform:uppercase}
.dorso p{margin:0;font-size:.82rem;line-height:1.35;flex:1;overflow:auto}
.ficha{display:flex;flex-wrap:wrap;gap:4px}
.ficha span{background:#222;color:#fff;border-radius:4px;padding:2px 6px;font-size:.68rem}
.dorso a{display:block;text-align:center;background:#111;color:var(--acc);text-decoration:none;font-weight:800;padding:9px;border-radius:6px}
.dorso small{text-align:center;color:#777;font-size:.65rem}
.vacio{grid-column:1/-1;text-align:center;color:var(--sub)}
footer{text-align:center;color:var(--sub);font-size:.8rem;padding:0 16px 24px}
dialog{border:0;border-radius:16px;padding:20px;max-width:340px;width:calc(100% - 32px);text-align:center;background:#fff;color:#111}
dialog::backdrop{background:#000c}
dialog img{width:100%;height:auto;display:block}
dialog .acciones{display:flex;gap:8px;margin-top:12px}
dialog .acciones>*{flex:1;border:0;border-radius:10px;padding:12px;font-weight:700;font-size:1rem;text-decoration:none}
dialog a{background:#111;color:var(--acc)}
dialog button{background:#e8e3f5;color:#111}
</style>
</head>
<body>
<header>
  <div class="cartel"><h1>🎬 Juegoteca</h1></div>
  <p>Elegí una caja, dala vuelta y a jugar</p>
  <button class="btnqr" id="abrirQR">📱 Mostrar QR</button>
</header>
<div class="filtros" id="filtros"></div>
<div class="cant"><label for="n">Somos</label><input id="n" type="number" min="1" inputmode="numeric" placeholder="—"><span>personas</span></div>
<main id="lista"></main>
<footer>Para agregar un juego, editá <code>juegos.json</code> en GitHub.</footer>

<dialog id="qr">
  <img src="qr-juegoteca.png" alt="Código QR de la Juegoteca" width="592" height="812">
  <div class="acciones">
    <a href="qr-juegoteca.png" download="qr-juegoteca.png">⬇️ Descargar</a>
    <button id="cerrarQR">Cerrar</button>
  </div>
</dialog>

<script>
let juegos=[],tipo="Todos";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function jugadores(g){
  if(g.min==null&&g.max==null) return "? jug.";
  if(g.min==null) return "hasta "+g.max;
  if(g.max==null) return g.min+"+ jug.";
  return g.min+"–"+g.max+" jug.";
}
// Calificación al estilo cine argentino: ATP, +13, +16, +18
function calif(g){
  if(g.calificacion) return g.calificacion;
  const n=parseInt(g.edad);
  if(isNaN(n)) return "VAR";
  if(n<13) return "ATP";
  if(n<16) return "+13";
  if(n<18) return "+16";
  return "+18";
}
function clsCalif(c){return c==="+13"?"mas":c==="+16"?"mas16":c==="+18"?"mas18":""}
function pinta(){
  const n=parseInt($("#n").value);
  const vis=juegos.filter(g=>(tipo==="Todos"||g.tipo===tipo)&&
    (!n||((g.min==null||n>=g.min)&&(g.max==null||n<=g.max))));
  $("#lista").innerHTML=vis.map(g=>{
    const [c1,c2]=g.colores||["#444","#111"];const c=calif(g);
    const ilus=g.imagen?`<img src="${esc(g.imagen)}" alt="" style="width:100%;height:100%;object-fit:cover">`:`<div>${esc(g.icono||"🎲")}</div>`;
    return `<article class="caja" tabindex="0" aria-label="${esc(g.nombre)}">
      <div class="giro">
        <div class="cara frente" style="background:linear-gradient(160deg,${esc(c1)},${esc(c2)})">
          <div class="lomo"><span>JUEGOTECA</span></div>
          <div class="top"><div class="calif ${clsCalif(c)}">${c}</div><div class="jug">👥 ${jugadores(g)}</div></div>
          <div class="ilus">${ilus}</div>
          <div class="titulo">${esc(g.nombre)}</div>
          <div class="lema">${esc(g.lema||g.tipo)}</div>
        </div>
        <div class="cara dorso">
          <h2>${esc(g.nombre)}</h2>
          <div class="ficha"><span>${esc(g.tipo)}</span><span>👥 ${jugadores(g)}</span><span>${c==="VAR"?"Edad: varía":"Edad "+esc(g.edad)}</span></div>
          <p>${esc(g.descripcion)}</p>
          <a href="${esc(g.url)}" target="_blank" rel="noopener">▶ JUGAR</a>
          <small>Tocá para dar vuelta</small>
        </div>
      </div>
    </article>`}).join("")||"<p class='vacio'>No hay juegos para ese filtro.</p>";
}
$("#lista").addEventListener("click",e=>{
  if(e.target.closest("a"))return;
  const c=e.target.closest(".caja"); if(c) c.classList.toggle("vuelta");
});
$("#lista").addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("caja")){e.preventDefault();e.target.classList.toggle("vuelta");}
});
$("#abrirQR").onclick=()=>$("#qr").showModal();
$("#cerrarQR").onclick=()=>$("#qr").close();
$("#qr").addEventListener("click",e=>{if(e.target.id==="qr")$("#qr").close();});
fetch("juegos.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{
  juegos=d;
  const tipos=["Todos",...new Set(d.map(g=>g.tipo))];
  $("#filtros").innerHTML=tipos.map(t=>`<button data-t="${esc(t)}" class="${t===tipo?"on":""}">${esc(t)}</button>`).join("");
  $("#filtros").onclick=e=>{const t=e.target.dataset.t;if(!t)return;tipo=t;
    document.querySelectorAll("#filtros button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));pinta();};
  $("#n").oninput=pinta;
  pinta();
});
</script>
</body>
</html>
