<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juegoteca</title>
<style>
:root{--bg:#14121f;--card:#221f33;--txt:#f2f0fa;--sub:#a9a4c4;--acc:#ffb547;--chip:#2f2b47}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:24px 16px 8px;text-align:center}
h1{margin:0;font-size:2rem;letter-spacing:.5px}
h1 span{color:var(--acc)}
header p{margin:6px 0 0;color:var(--sub)}
.filtros{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px 16px}
.filtros button{border:0;border-radius:999px;padding:8px 14px;background:var(--chip);color:var(--txt);font-size:.95rem}
.filtros button.on{background:var(--acc);color:#1b1400;font-weight:600}
.cant{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--sub);padding:0 16px 8px}
.cant input{width:64px;padding:6px;border-radius:8px;border:0;background:var(--chip);color:var(--txt);font-size:1rem}
main{display:grid;gap:12px;padding:8px 16px 32px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));max-width:1100px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card h2{margin:0;font-size:1.2rem}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.meta span{background:var(--chip);border-radius:6px;padding:3px 8px;font-size:.8rem;color:var(--sub)}
.card p{margin:0;color:var(--sub);line-height:1.4;flex:1}
.card a{display:block;text-align:center;background:var(--acc);color:#1b1400;text-decoration:none;font-weight:700;padding:10px;border-radius:10px}
.propio{border:2px solid var(--acc)}
footer{text-align:center;color:var(--sub);font-size:.8rem;padding:0 16px 24px}
</style>
</head>
<body>
<header>
  <h1>🎲 Juego<span>teca</span></h1>
  <p>Elegí un juego y dale a Jugar</p>
</header>
<div class="filtros" id="filtros"></div>
<div class="cant"><label for="n">Somos</label><input id="n" type="number" min="1" inputmode="numeric" placeholder="—"><span>personas</span></div>
<main id="lista"></main>
<footer>Para agregar un juego, editá <code>juegos.json</code> en GitHub.</footer>
<script>
let juegos=[],tipo="Todos";
const $=s=>document.querySelector(s);
function jugadores(g){
  if(g.min==null&&g.max==null) return "? jugadores";
  if(g.min==null) return "hasta "+g.max;
  if(g.max==null) return g.min+"+";
  return g.min+" a "+g.max;
}
function pinta(){
  const n=parseInt($("#n").value);
  const vis=juegos.filter(g=>(tipo==="Todos"||g.tipo===tipo)&&
    (!n||((g.min==null||n>=g.min)&&(g.max==null||n<=g.max))));
  $("#lista").innerHTML=vis.map(g=>`
    <article class="card${g.propio?" propio":""}">
      <h2>${g.nombre}</h2>
      <div class="meta"><span>${g.tipo}</span><span>👥 ${jugadores(g)}</span><span>Edad ${g.edad}</span></div>
      <p>${g.descripcion}</p>
      <a href="${g.url}" target="_blank" rel="noopener">Jugar</a>
    </article>`).join("")||"<p style='text-align:center;color:var(--sub)'>No hay juegos para ese filtro.</p>";
}
fetch("juegos.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{
  juegos=d;
  const tipos=["Todos",...new Set(d.map(g=>g.tipo))];
  $("#filtros").innerHTML=tipos.map(t=>`<button data-t="${t}" class="${t===tipo?"on":""}">${t}</button>`).join("");
  $("#filtros").onclick=e=>{const t=e.target.dataset.t;if(!t)return;tipo=t;
    document.querySelectorAll("#filtros button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));pinta();};
  $("#n").oninput=pinta;
  pinta();
});
</script>
</body>
</html>
