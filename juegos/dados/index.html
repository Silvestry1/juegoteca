<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a1d">
<title>Dados</title>
<style>
:root{--bg:#0f2a1d;--card:#0a1d14;--txt:#ffffff;--sub:#cfe3d6;--acc:#ffc23d;--rojo:#d62828;
  --d4:#ff6b6b;--d6:#f5f1e6;--d8:#4ecdc4;--d10:#a78bfa;--d12:#ffa94d;--d20:#ffd43b;--d100:#74c0fc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
.wrap{min-height:100vh;padding:12px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto}
button{font:inherit;border:0;border-radius:14px;padding:10px 12px;background:#ffffff1f;color:var(--txt);font-weight:800;cursor:pointer}
button:disabled{opacity:.35}
a.volver{color:var(--sub);text-align:center;font-size:1rem;padding:6px}

/* selector de modo */
.modos{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#00000040;border-radius:16px;padding:5px}
.modos button{padding:12px 6px;font-size:1.05rem;background:transparent;color:var(--sub)}
.modos button.on{background:var(--acc);color:#1b1400}
.modo{display:none;flex-direction:column;gap:14px}
.modo.on{display:flex}

/* paño */
.paño{background:radial-gradient(ellipse at center,#2a6a47,#17402b 75%);border-radius:22px;padding:18px 12px;display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-content:center;box-shadow:inset 0 0 40px #000a;border:8px solid #4a2f1a;min-height:260px}
.paño .vacio{color:var(--sub);font-size:1.1rem;text-align:center}

/* dado clásico grande */
.d6g{width:var(--t,96px);height:var(--t,96px);position:relative;cursor:pointer;transition:transform .2s}
.d6g svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 6px #0009)}
.d6g.guardado{transform:translateY(-6px)}
.d6g.guardado::after{content:"GUARDADO";position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);background:var(--acc);color:#1b1400;font-size:.7rem;font-weight:900;padding:2px 6px;border-radius:6px;letter-spacing:.5px;white-space:nowrap}
.d6g.guardado svg{filter:drop-shadow(0 0 0 var(--acc)) drop-shadow(0 0 6px var(--acc))}
.rueda{animation:rueda .6s cubic-bezier(.25,.7,.35,1) both}
@keyframes rueda{0%{transform:translate(var(--dx),-60px) rotate(var(--rot)) scale(.5);opacity:0}55%{transform:translate(0,8px) rotate(calc(var(--rot) * -0.12)) scale(1.06);opacity:1}100%{transform:none}}

/* controles grandes */
.cantidad{display:flex;align-items:center;justify-content:center;gap:14px;font-size:1.2rem;font-weight:800}
.cantidad button{width:60px;height:60px;font-size:2rem;padding:0;border-radius:50%}
.cantidad b{font-size:2.4rem;min-width:44px;text-align:center}
.tirar{padding:22px;font-size:1.8rem;font-weight:900;background:var(--acc);color:#1b1400;text-transform:uppercase;letter-spacing:2px;border-radius:18px;box-shadow:0 6px 0 #b8860b}
.tirar:active{transform:translateY(4px);box-shadow:0 2px 0 #b8860b}
.fila{display:flex;gap:10px}
.fila button{flex:1;padding:14px 8px;font-size:1.05rem}
.interruptor{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-radius:16px;padding:12px 16px;font-size:1.15rem;font-weight:800;cursor:pointer;user-select:none}
.interruptor .sw{width:62px;height:36px;border-radius:999px;background:#ffffff33;position:relative;flex:none;transition:background .2s}
.interruptor .sw::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .2s}
.interruptor[aria-checked="true"] .sw{background:var(--acc)}
.interruptor[aria-checked="true"] .sw::after{left:30px}
.anuncio{text-align:center;min-height:3.4rem;display:flex;flex-direction:column;justify-content:center}
.anuncio .jugada{font-size:2.2rem;font-weight:900;color:var(--acc);text-transform:uppercase;text-shadow:0 0 14px #ffc23d66;line-height:1.05}
.anuncio .suma{font-size:1.4rem;font-weight:800}
.anuncio .suma b{font-size:2.2rem;color:var(--acc)}
.tiro{text-align:center;font-size:1.15rem;font-weight:800;color:var(--sub)}
.ayuda{font-size:1rem;color:var(--sub);margin:0;text-align:center;line-height:1.35}

/* modo rol */
.bloque{background:var(--card);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.bloque h3{margin:0;font-size:.85rem;text-transform:uppercase;letter-spacing:1px;color:var(--sub);display:flex;justify-content:space-between;align-items:center}
.bloque h3 button{padding:4px 10px;font-size:.8rem;text-transform:none;letter-spacing:0}
.tipos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tipos button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;position:relative}
.tipos button svg{width:34px;height:34px}
.tipos button .n{position:absolute;top:-6px;right:-6px;background:var(--acc);color:#1b1400;border-radius:999px;min-width:22px;height:22px;font-size:.75rem;display:none;align-items:center;justify-content:center;padding:0 5px}
.tipos button .n.on{display:flex}
.rapidos{display:flex;gap:6px;flex-wrap:wrap}
.rapidos button{flex:1;min-width:64px;padding:8px 6px;font-size:.85rem;background:#ffffff14}
.mod{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:.95rem}
.mod button{width:42px;padding:8px 0}
.mod b{min-width:36px;text-align:center;color:var(--txt);font-size:1.1rem}
.pedido{text-align:center;font-weight:800;font-size:1.1rem;min-height:1.4em}
#pañoRol{min-height:200px;gap:10px}
.dado{width:64px;height:64px;position:relative;cursor:pointer;filter:drop-shadow(0 4px 4px #0008)}
.dado svg{width:100%;height:100%;display:block}
.dado.fijo{outline:3px dashed var(--acc);outline-offset:3px;border-radius:10px}
.dado.fijo::after{content:"🔒";position:absolute;top:-10px;right:-10px;font-size:.9rem}
.total{text-align:center}
.total .num{font-size:3.6rem;font-weight:900;line-height:1;color:var(--acc);text-shadow:0 0 16px #ffc23d55}
.total .det{color:var(--sub);font-size:.95rem;margin-top:4px;word-break:break-word}
.total .extra{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.total .extra span{background:#ffffff14;border-radius:6px;padding:3px 8px;font-size:.85rem;color:var(--sub)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.hist li{display:flex;justify-content:space-between;gap:10px;background:#ffffff0d;border-radius:8px;padding:8px 10px;font-size:.9rem}
.hist li .q{color:var(--sub);word-break:break-word}
.hist li .r{font-weight:900;color:var(--acc);font-size:1rem;flex:none}
.hist .nada{color:var(--sub);text-align:center;background:none}
</style>
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
      <linearGradient id="cuerpo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f3eee2"/><stop offset="1" stop-color="#d9d1bd"/></linearGradient>
      <radialGradient id="pn" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#555"/><stop offset="1" stop-color="#0d0d0d"/></radialGradient>
      <radialGradient id="pr" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#ff5a5a"/><stop offset="1" stop-color="#a30f0f"/></radialGradient>
    </defs>
</svg>
<div class="wrap">
  <div class="modos" role="tablist">
    <button id="tabSimple" role="tab" data-m="simple">🎲 Generala · 10.000</button>
    <button id="tabRol" role="tab" data-m="rol">🧙 Rol</button>
  </div>

  <!-- ===== MODO SIMPLE ===== -->
  <section class="modo" id="simple">
    <div class="paño" id="pañoS"></div>
    <div class="anuncio" id="anuncioS"></div>
    <button class="tirar" id="tirarS">Tirar</button>
    <div class="tiro" id="tiroS"></div>
    <p class="ayuda">Tocá un dado para guardarlo.<br>Los guardados no se vuelven a tirar.</p>
    <div class="fila"><button id="nuevoS">🔄 Turno nuevo</button></div>
    <div class="cantidad"><span>Dados:</span><button id="menosS" aria-label="Un dado menos">−</button><b id="cantS">5</b><button id="masS" aria-label="Un dado más">+</button></div>
    <div class="interruptor" id="sumaS" role="switch" aria-checked="false" tabindex="0"><span>Mostrar la suma</span><span class="sw"></span></div>
  </section>

  <!-- ===== MODO ROL ===== -->
  <section class="modo" id="rol">
    <section class="bloque">
      <h3>Elegí los dados <button id="limpiar">Vaciar</button></h3>
      <div class="tipos" id="tipos"></div>
      <div class="rapidos" id="rapidos"></div>
      <div class="mod"><span>Sumar o restar</span><button id="menos" aria-label="Restar 1">−</button><b id="modv">0</b><button id="mas" aria-label="Sumar 1">+</button></div>
      <div class="pedido" id="pedido"></div>
    </section>
    <div class="paño" id="pañoRol"></div>
    <div class="total" id="total" hidden>
      <div class="num" id="num">0</div>
      <div class="det" id="det"></div>
      <div class="extra" id="extra"></div>
    </div>
    <button class="tirar" id="tirar" disabled>Tirar</button>
    <div class="fila"><button id="soltar" disabled>🔓 Soltar fijos</button><button id="sacar" disabled>➖ Sacar último</button></div>
    <div class="interruptor" id="sumaR" role="switch" aria-checked="true" tabindex="0"><span>Mostrar la suma</span><span class="sw"></span></div>
    <section class="bloque">
      <h3>Historial <button id="borrarHist">Borrar</button></h3>
      <ul class="hist" id="hist"></ul>
    </section>
  </section>

  <a class="volver" href="../../">← Volver a la Juegoteca</a>
</div>

<script>
const $=s=>document.querySelector(s);
const leer=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const grabar=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const vibrar=()=>{if(navigator.vibrate)try{navigator.vibrate(40)}catch(e){}};

// Número al azar sin sesgo, con crypto si está disponible
function azar(n){
  if(window.crypto&&crypto.getRandomValues){
    const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;
    do crypto.getRandomValues(a); while(a[0]>=lim);
    return a[0]%n+1;
  }
  return Math.floor(Math.random()*n)+1;
}

/* ---------- selector de modo ---------- */
let modo=leer("juegoteca-dados-modo","simple");
function ponerModo(m){
  modo=m;grabar("juegoteca-dados-modo",m);
  document.querySelectorAll(".modos button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
  document.querySelectorAll(".modo").forEach(s=>s.classList.toggle("on",s.id===m));
}
document.querySelector(".modos").onclick=e=>{const b=e.target.closest("button");if(b)ponerModo(b.dataset.m)};

function interruptor(el,clave,alCambiar){
  const v=leer(clave,el.getAttribute("aria-checked")==="true");
  el.setAttribute("aria-checked",v);
  const t=()=>{const n=el.getAttribute("aria-checked")!=="true";el.setAttribute("aria-checked",n);grabar(clave,n);alCambiar()};
  el.onclick=t;el.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();t()}};
}
const prendido=el=>el.getAttribute("aria-checked")==="true";

/* ---------- MODO SIMPLE (dados clásicos) ---------- */
const PIPS={1:[[50,50]],2:[[27,27],[73,73]],3:[[27,27],[50,50],[73,73]],4:[[27,27],[73,27],[27,73],[73,73]],
  5:[[27,27],[73,27],[50,50],[27,73],[73,73]],6:[[27,25],[73,25],[27,50],[73,50],[27,75],[73,75]]};
function dadoClasico(v){
  const p=(PIPS[v]||[]).map(([x,y])=>v===1
    ?`<circle cx="${x}" cy="${y}" r="13" fill="url(#pr)"/>`
    :`<circle cx="${x}" cy="${y}" r="9.5" fill="url(#pn)"/>`).join("");
  return `<svg viewBox="0 0 100 100" aria-hidden="true">
    <rect x="4" y="4" width="92" height="92" rx="20" fill="url(#cuerpo)" stroke="#00000040" stroke-width="2"/>
    <rect x="9" y="8" width="82" height="20" rx="10" fill="#ffffff70"/>
    ${p}</svg>`;
}
let simple={cant:leer("juegoteca-dados-cant",5),dados:[],tiro:0};
const MAXS=6;
function tamaño(){const n=simple.cant;return n<=2?130:n<=3?110:n<=4?100:92}
function pintaSimple(anim){
  const t=tamaño();
  $("#pañoS").innerHTML=simple.dados.length
    ?simple.dados.map((d,i)=>{
      const r=anim&&!d.g?` rueda" style="--t:${t}px;--rot:${(Math.random()*720-360)|0}deg;--dx:${(Math.random()*80-40)|0}px;animation-delay:${i*60}ms`:`" style="--t:${t}px`;
      return `<div class="d6g${d.g?" guardado":""}${r}" data-i="${i}" role="button" aria-label="Dado ${d.v}${d.g?", guardado":""}">${dadoClasico(d.v)}</div>`}).join("")
    :'<div class="vacio">Tocá TIRAR</div>';
  $("#cantS").textContent=simple.cant;
  $("#menosS").disabled=simple.cant<=1;$("#masS").disabled=simple.cant>=MAXS;
  $("#tiroS").textContent=simple.tiro?`Tiro ${simple.tiro}`:"";
  const todos=simple.dados.length&&simple.dados.every(d=>d.g);
  $("#tirarS").disabled=!!todos;
  anuncia();
}
// Detecta jugadas de Generala con 5 dados
function jugadaGenerala(vs){
  if(vs.length!==5)return "";
  const c={};vs.forEach(v=>c[v]=(c[v]||0)+1);
  const f=Object.values(c).sort((a,b)=>b-a);
  if(f[0]===5)return "¡Generala!";
  if(f[0]===4)return "Póker";
  if(f[0]===3&&f[1]===2)return "Full";
  const s=[...new Set(vs)].sort().join("");
  if(s==="12345"||s==="23456"||s==="13456")return "Escalera";
  return "";
}
function anuncia(){
  const vs=simple.dados.map(d=>d.v);
  let h="";
  const j=jugadaGenerala(vs);
  if(j)h+=`<div class="jugada">${j}${simple.tiro===1?" servida":""}</div>`;
  if(prendido($("#sumaS"))&&vs.length)h+=`<div class="suma">Suma: <b>${vs.reduce((a,b)=>a+b,0)}</b></div>`;
  $("#anuncioS").innerHTML=h;
}
function tirarSimple(){
  if(!simple.dados.length||simple.dados.length!==simple.cant){
    simple.dados=Array.from({length:simple.cant},()=>({v:1,g:false}));simple.tiro=0;
  }
  if(simple.dados.every(d=>d.g))return;
  simple.dados.forEach(d=>{if(!d.g)d.v=azar(6)});
  simple.tiro++;
  pintaSimple(true);vibrar();
}
function turnoNuevo(){simple.dados=[];simple.tiro=0;pintaSimple(false)}
$("#tirarS").onclick=tirarSimple;
$("#nuevoS").onclick=turnoNuevo;
$("#pañoS").onclick=e=>{
  const d=e.target.closest(".d6g");if(!d)return;
  const x=simple.dados[d.dataset.i];x.g=!x.g;pintaSimple(false);
};
$("#menosS").onclick=()=>{if(simple.cant>1){simple.cant--;grabar("juegoteca-dados-cant",simple.cant);turnoNuevo()}};
$("#masS").onclick=()=>{if(simple.cant<MAXS){simple.cant++;grabar("juegoteca-dados-cant",simple.cant);turnoNuevo()}};
interruptor($("#sumaS"),"juegoteca-dados-suma-simple",anuncia);

/* ---------- MODO ROL ---------- */
const CARAS=[4,6,8,10,12,20,100];
const COLOR={4:"--d4",6:"--d6",8:"--d8",10:"--d10",12:"--d12",20:"--d20",100:"--d100"};
const RAPIDOS=[["1d6",[6]],["2d6",[6,6]],["1d20",[20]],["2d20",[20,20]],["1d100",[100]]];
let dados=[],mod=0,hist=leer("juegoteca-dados-hist",[]);
if(!Array.isArray(hist))hist=[];
const guardarHist=()=>grabar("juegoteca-dados-hist",hist.slice(0,30));
const FORMA={
  4:'<polygon points="50,6 95,90 5,90"/>',
  6:'<rect x="8" y="8" width="84" height="84" rx="16"/>',
  8:'<polygon points="50,4 94,50 50,96 6,50"/>',
  10:'<polygon points="50,4 94,40 50,96 6,40"/>',
  12:'<polygon points="50,4 95,37 78,92 22,92 5,37"/>',
  20:'<polygon points="50,3 92,27 92,73 50,97 8,73 8,27"/>',
  100:'<circle cx="50" cy="50" r="45"/>'
};
const d100=v=>v===100?"00":String(v).padStart(2,"0");
function svg(c,v,chico){
  if(!FORMA[c]){
    return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="45" fill="#ffffffcc" stroke="#0006" stroke-width="3"/><text x="50" y="${v==null?60:64}" font-size="${v==null?24:38}" text-anchor="middle" font-weight="900" fill="#111">${v==null?"d"+c:v}</text></svg>`;
  }
  let dentro="";
  if(v==null) dentro=`<text x="50" y="${c===4?70:60}" font-size="${chico?30:26}" text-anchor="middle" font-weight="900" fill="#111">d${c}</text>`;
  else if(c===6) return dadoClasico(v);
  else{
    const txt=c===100?d100(v):String(v), fs=txt.length>2?30:txt.length>1?36:42;
    const y=c===4?74:50+fs*.36;
    dentro=`<text x="50" y="${y}" font-size="${fs}" text-anchor="middle" font-weight="900" fill="#111">${txt}</text>`;
    if(c!==100&&(v===6||v===9)) dentro+=`<rect x="38" y="${y+5}" width="24" height="4" fill="#111"/>`;
  }
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="var(${COLOR[c]})" stroke="#0006" stroke-width="3">${FORMA[c]}</g>${dentro}</svg>`;
}
function pedido(){
  if(!dados.length)return "";
  const cuenta={};dados.forEach(d=>cuenta[d.c]=(cuenta[d.c]||0)+1);
  const orden=Object.keys(cuenta).map(Number).sort((a,b)=>a-b);
  let t=orden.map(c=>cuenta[c]+"d"+c).join(" + ");
  if(mod)t+=(mod>0?" + ":" − ")+Math.abs(mod);
  return t;
}
function pintaTipos(){
  const cuenta={};dados.forEach(d=>cuenta[d.c]=(cuenta[d.c]||0)+1);
  $("#tipos").innerHTML=CARAS.map(c=>`<button data-c="${c}" aria-label="Agregar d${c}">${svg(c,null,true)}<span>d${c}</span><span class="n ${cuenta[c]?"on":""}">${cuenta[c]||""}</span></button>`).join("")
    +`<button data-c="otro" aria-label="Dado de otra cantidad de caras"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#ffffff22" stroke="#0006" stroke-width="3"/><text x="50" y="62" font-size="34" text-anchor="middle" font-weight="900" fill="#fff">?</text></svg><span>Otro</span></button>`;
}
function pintaRol(anim){
  const p=$("#pañoRol");
  p.innerHTML=dados.length?dados.map((d,i)=>{
    const r=anim&&!d.fijo?` rueda" style="--rot:${(Math.random()*720-360)|0}deg;--dx:${(Math.random()*60-30)|0}px;animation-delay:${i*40}ms`:"";
    return `<div class="dado${d.fijo?" fijo":""}${r}" data-i="${i}" role="button" aria-label="d${d.c}${d.v!=null?": "+d.v:""}${d.fijo?", fijo":""}">${svg(d.c,d.v)}</div>`;
  }).join(""):'<div class="vacio">Tocá un dado de arriba para sumarlo a la tirada</div>';
  $("#pedido").textContent=pedido();
  $("#modv").textContent=(mod>0?"+":"")+mod;
  $("#tirar").disabled=!dados.length;
  $("#sacar").disabled=!dados.length;
  $("#soltar").disabled=!dados.some(d=>d.fijo);
  pintaTipos();
}
function pintaHist(){
  const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  $("#hist").innerHTML=hist.length?hist.map(h=>`<li><span class="q">${esc(h.q)}<br><small>${esc(h.d)}</small></span><span class="r">${esc(h.t)}</span></li>`).join("")
    :'<li class="nada">Todavía no tiraste</li>';
}
function resultadoRol(){
  if(!dados.length||dados.some(d=>d.v==null)){$("#total").hidden=true;return}
  const conSuma=prendido($("#sumaR"));
  const suma=dados.reduce((s,d)=>s+d.v,0)+mod;
  const vals=dados.map(d=>d.c===100?d100(d.v):d.v);
  $("#num").hidden=!conSuma;
  $("#num").textContent=suma;
  $("#det").textContent=conSuma?vals.join(" + ")+(mod?(mod>0?" + ":" − ")+Math.abs(mod):""):vals.join("   ");
  if(!conSuma)$("#det").style.fontSize="1.8rem";else $("#det").style.fontSize="";
  const extra=[];
  if(dados.length>1){
    const vs=dados.map(d=>d.v);
    extra.push("Mayor "+Math.max(...vs),"Menor "+Math.min(...vs));
    if(dados.every(d=>d.c===dados[0].c)){
      const rep={};vs.forEach(v=>rep[v]=(rep[v]||0)+1);
      const m=Math.max(...Object.values(rep));if(m>1)extra.push(m+" iguales");
    }
  }
  if(dados.some(d=>d.c===20&&d.v===20))extra.push("¡20 natural!");
  if(dados.some(d=>d.c===20&&d.v===1))extra.push("Pifia en d20");
  $("#extra").innerHTML=extra.map(t=>`<span>${t}</span>`).join("");
  $("#total").hidden=false;
}
function agregar(c){if(dados.length>=30)return;dados.push({c,v:null,fijo:false});$("#total").hidden=true;pintaRol(false)}
$("#tipos").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  let c=b.dataset.c;
  if(c==="otro"){const r=prompt("¿Cuántas caras? (2 a 1000)","3");c=parseInt(r);if(!(c>=2&&c<=1000))return}
  agregar(+c);
};
$("#rapidos").innerHTML=RAPIDOS.map(([t],i)=>`<button data-i="${i}">${t}</button>`).join("");
$("#rapidos").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  dados=RAPIDOS[b.dataset.i][1].map(c=>({c,v:null,fijo:false}));mod=0;$("#total").hidden=true;pintaRol(false);
};
$("#limpiar").onclick=()=>{dados=[];mod=0;$("#total").hidden=true;pintaRol(false)};
$("#sacar").onclick=()=>{dados.pop();pintaRol(false);resultadoRol()};
$("#soltar").onclick=()=>{dados.forEach(d=>d.fijo=false);pintaRol(false)};
$("#mas").onclick=()=>{if(mod<99)mod++;pintaRol(false);resultadoRol()};
$("#menos").onclick=()=>{if(mod>-99)mod--;pintaRol(false);resultadoRol()};
$("#pañoRol").onclick=e=>{
  const d=e.target.closest(".dado");if(!d)return;
  const x=dados[d.dataset.i];if(x.v==null)return;x.fijo=!x.fijo;pintaRol(false);
};
$("#borrarHist").onclick=()=>{hist=[];guardarHist();pintaHist()};
$("#tirar").onclick=()=>{
  if(!dados.length)return;
  dados.forEach(d=>{if(!d.fijo||d.v==null){d.v=azar(d.c);d.fijo=false}});
  pintaRol(true);resultadoRol();
  const vals=dados.map(d=>d.c===100?d100(d.v):d.v);
  const suma=dados.reduce((s,d)=>s+d.v,0)+mod;
  hist.unshift({q:pedido(),d:vals.join(" + ")+(mod?(mod>0?" + ":" − ")+Math.abs(mod):""),t:suma});
  hist=hist.slice(0,30);guardarHist();pintaHist();vibrar();
};
interruptor($("#sumaR"),"juegoteca-dados-suma-rol",resultadoRol);

document.addEventListener("keydown",e=>{
  if((e.key===" "||e.key==="Enter")&&e.target===document.body){e.preventDefault();modo==="simple"?tirarSimple():$("#tirar").click()}
});

ponerModo(modo==="rol"?"rol":"simple");
pintaSimple(false);pintaRol(false);pintaHist();
</script>
