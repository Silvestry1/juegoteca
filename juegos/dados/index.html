<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12261c">
<title>Dados</title>
<style>
:root{--bg:#12261c;--paño:#1b3a2a;--card:#0e1f17;--txt:#f5f1e6;--sub:#a9c2b3;--acc:#ffc23d;
  --d4:#ff6b6b;--d6:#f5f1e6;--d8:#4ecdc4;--d10:#a78bfa;--d12:#ffa94d;--d20:#ffd43b;--d100:#74c0fc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
.wrap{min-height:100%;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto}
h1{margin:4px 0 0;font-size:1.9rem;text-transform:uppercase;color:var(--acc);text-shadow:0 0 12px #ffc23d66;text-align:center}
.sub{margin:0;color:var(--sub);text-align:center;font-size:.92rem}
button{font:inherit;border:0;border-radius:12px;padding:10px 12px;background:#ffffff1a;color:var(--txt);font-weight:700;cursor:pointer}
button:disabled{opacity:.4}
.bloque{background:var(--card);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.bloque h3{margin:0;font-size:.8rem;text-transform:uppercase;letter-spacing:1px;color:var(--sub);display:flex;justify-content:space-between;align-items:center}
.bloque h3 button{padding:4px 10px;font-size:.75rem;text-transform:none;letter-spacing:0}
.tipos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tipos button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;position:relative}
.tipos button svg{width:34px;height:34px}
.tipos button .n{position:absolute;top:-6px;right:-6px;background:var(--acc);color:#1b1400;border-radius:999px;min-width:22px;height:22px;font-size:.75rem;display:none;align-items:center;justify-content:center;padding:0 5px}
.tipos button .n.on{display:flex}
.rapidos{display:flex;gap:6px;flex-wrap:wrap}
.rapidos button{flex:1;min-width:64px;padding:8px 6px;font-size:.85rem;background:#ffffff12}
.mod{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:.9rem}
.mod button{width:40px;padding:8px 0}
.mod b{min-width:36px;text-align:center;color:var(--txt);font-size:1.05rem}
.pedido{text-align:center;font-weight:800;font-size:1.05rem;min-height:1.4em}
/* paño */
.paño{background:radial-gradient(ellipse at center,#24503a,var(--paño) 70%);border-radius:18px;min-height:190px;padding:14px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-content:center;box-shadow:inset 0 0 30px #0009;border:6px solid #3a2616}
.paño .vacio{color:var(--sub);font-size:.95rem;text-align:center}
.dado{width:64px;height:64px;position:relative;cursor:pointer;filter:drop-shadow(0 4px 4px #0008)}
.dado svg{width:100%;height:100%;display:block}
.dado.fijo{outline:3px dashed var(--acc);outline-offset:3px;border-radius:10px}
.dado.fijo::after{content:"🔒";position:absolute;top:-10px;right:-10px;font-size:.9rem}
.dado.rueda{animation:rueda .55s cubic-bezier(.3,.7,.4,1)}
@keyframes rueda{0%{transform:translate(var(--dx),-40px) rotate(var(--rot)) scale(.6);opacity:.3}60%{transform:translate(0,6px) rotate(calc(var(--rot) * -0.15)) scale(1.05);opacity:1}100%{transform:none}}
.total{text-align:center}
.total .num{font-size:3.6rem;font-weight:900;line-height:1;color:var(--acc);text-shadow:0 0 16px #ffc23d55}
.total .det{color:var(--sub);font-size:.9rem;margin-top:4px;word-break:break-word}
.total .extra{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.total .extra span{background:#ffffff14;border-radius:6px;padding:3px 8px;font-size:.8rem;color:var(--sub)}
.tirar{padding:18px;font-size:1.3rem;font-weight:900;background:var(--acc);color:#1b1400;text-transform:uppercase;letter-spacing:1px}
.acc2{display:flex;gap:8px}
.acc2 button{flex:1;font-size:.9rem}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.hist li{display:flex;justify-content:space-between;gap:10px;background:#ffffff0d;border-radius:8px;padding:8px 10px;font-size:.88rem}
.hist li .q{color:var(--sub);word-break:break-word}
.hist li .r{font-weight:900;color:var(--acc);font-size:1rem;flex:none}
.hist .nada{color:var(--sub);font-size:.88rem;text-align:center;background:none}
.ayuda{font-size:.82rem;color:var(--sub);margin:0;text-align:center}
a.volver{color:var(--sub);text-align:center;font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎲 Dados</h1>
  <p class="sub">Armá la tirada, tocá TIRAR y listo</p>

  <section class="bloque">
    <h3>Elegí los dados <button id="limpiar">Vaciar</button></h3>
    <div class="tipos" id="tipos"></div>
    <div class="rapidos" id="rapidos"></div>
    <div class="mod"><span>Sumar o restar</span><button id="menos" aria-label="Restar 1">−</button><b id="modv">0</b><button id="mas" aria-label="Sumar 1">+</button></div>
    <div class="pedido" id="pedido"></div>
  </section>

  <div class="paño" id="paño"><div class="vacio">Tocá un dado de arriba para sumarlo a la tirada</div></div>

  <div class="total" id="total" hidden>
    <div class="num" id="num">0</div>
    <div class="det" id="det"></div>
    <div class="extra" id="extra"></div>
  </div>

  <button class="tirar" id="tirar" disabled>Tirar</button>
  <div class="acc2"><button id="soltar" disabled>🔓 Soltar los fijos</button><button id="sacar" disabled>➖ Sacar último dado</button></div>
  <p class="ayuda">Tocá un dado del paño para dejarlo fijo y que no se vuelva a tirar (sirve para juegos tipo Generala).</p>

  <section class="bloque">
    <h3>Historial <button id="borrarHist">Borrar</button></h3>
    <ul class="hist" id="hist"></ul>
  </section>

  <a class="volver" href="../../">← Volver a la Juegoteca</a>
</div>

<script>
const $=s=>document.querySelector(s);
const CARAS=[4,6,8,10,12,20,100];
const COLOR={4:"--d4",6:"--d6",8:"--d8",10:"--d10",12:"--d12",20:"--d20",100:"--d100"};
const RAPIDOS=[["1d6",[6]],["2d6",[6,6]],["5d6",[6,6,6,6,6]],["1d20",[20]],["1d100",[100]]];
let dados=[];      // [{c:6, v:null, fijo:false}]
let mod=0, hist=[];
const KEY="juegoteca-dados-hist";
try{hist=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){hist=[]}
const guardar=()=>{try{localStorage.setItem(KEY,JSON.stringify(hist.slice(0,30)))}catch(e){}};

// Número al azar sin sesgo, con crypto si está disponible
function azar(n){
  if(window.crypto&&crypto.getRandomValues){
    const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;
    do crypto.getRandomValues(a); while(a[0]>=lim);
    return a[0]%n+1;
  }
  return Math.floor(Math.random()*n)+1;
}

// Formas de cada dado
const FORMA={
  4:'<polygon points="50,6 95,90 5,90"/>',
  6:'<rect x="8" y="8" width="84" height="84" rx="16"/>',
  8:'<polygon points="50,4 94,50 50,96 6,50"/>',
  10:'<polygon points="50,4 94,40 50,96 6,40"/>',
  12:'<polygon points="50,4 95,37 78,92 22,92 5,37"/>',
  20:'<polygon points="50,3 92,27 92,73 50,97 8,73 8,27"/>',
  100:'<circle cx="50" cy="50" r="45"/>'
};
const PIPS={1:[[50,50]],2:[[28,28],[72,72]],3:[[28,28],[50,50],[72,72]],4:[[28,28],[72,28],[28,72],[72,72]],
  5:[[28,28],[72,28],[50,50],[28,72],[72,72]],6:[[28,26],[72,26],[28,50],[72,50],[28,74],[72,74]]};
function svg(c,v,chico){
  const col=`var(${COLOR[c]})`;
  let dentro="";
  if(v==null) dentro=`<text x="50" y="${c===4?70:60}" font-size="${chico?30:26}" text-anchor="middle" font-weight="900" fill="#111">d${c}</text>`;
  else if(c===6 && !chico) dentro=PIPS[v].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="9" fill="#111"/>`).join("");
  else{
    const txt=c===100?(v===100?"00":String(v).padStart(2,"0")):v, fs=String(txt).length>2?30:String(txt).length>1?36:42;
    const y=c===4?74:50+fs*.36;
    dentro=`<text x="50" y="${y}" font-size="${fs}" text-anchor="middle" font-weight="900" fill="#111">${txt}</text>`;
    if(c!==4&&(v===6||v===9)&&c!==100) dentro+=`<rect x="38" y="${y+5}" width="24" height="4" fill="#111"/>`;
  }
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="${col}" stroke="#0006" stroke-width="3">${FORMA[c]}</g>${dentro}</svg>`;
}
// d100 tira 1-100 (se muestra 00 para el 100)
const valorD100=v=>v===100?"00":String(v).padStart(2,"0");

function pedido(){
  if(!dados.length) return "";
  const cuenta={};dados.forEach(d=>cuenta[d.c]=(cuenta[d.c]||0)+1);
  let t=CARAS.filter(c=>cuenta[c]).map(c=>cuenta[c]+"d"+c).join(" + ");
  if(mod) t+=(mod>0?" + ":" − ")+Math.abs(mod);
  return t;
}
function pintaTipos(){
  const cuenta={};dados.forEach(d=>cuenta[d.c]=(cuenta[d.c]||0)+1);
  $("#tipos").innerHTML=CARAS.map(c=>`<button data-c="${c}" aria-label="Agregar d${c}">${svg(c,null,true)}<span>d${c}</span><span class="n ${cuenta[c]?"on":""}">${cuenta[c]||""}</span></button>`).join("")
    +`<button data-c="otro" aria-label="Dado de otra cantidad de caras"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#ffffff22" stroke="#0006" stroke-width="3"/><text x="50" y="62" font-size="34" text-anchor="middle" font-weight="900" fill="#fff">?</text></svg><span>Otro</span></button>`;
}
function pintaPaño(anim){
  const p=$("#paño");
  if(!dados.length){p.innerHTML='<div class="vacio">Tocá un dado de arriba para sumarlo a la tirada</div>';return}
  p.innerHTML=dados.map((d,i)=>{
    const forma=FORMA[d.c]?d.c:null;
    const dib=forma?svg(d.c,d.v):`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#ffffffcc" stroke="#0006" stroke-width="3"/><text x="50" y="${d.v==null?60:64}" font-size="${d.v==null?24:38}" text-anchor="middle" font-weight="900" fill="#111">${d.v==null?"d"+d.c:d.v}</text></svg>`;
    const r=anim&&!d.fijo?` rueda" style="--rot:${(Math.random()*720-360)|0}deg;--dx:${(Math.random()*60-30)|0}px;animation-delay:${i*40}ms`:"";
    return `<div class="dado${d.fijo?" fijo":""}${r}" data-i="${i}" role="button" aria-label="d${d.c}${d.v!=null?": "+d.v:""}${d.fijo?", fijo":""}">${dib}</div>`;
  }).join("");
}
function pintaControles(){
  $("#pedido").textContent=pedido();
  $("#modv").textContent=(mod>0?"+":"")+mod;
  $("#tirar").disabled=!dados.length;
  $("#sacar").disabled=!dados.length;
  $("#soltar").disabled=!dados.some(d=>d.fijo);
  pintaTipos();
}
function pintaHist(){
  $("#hist").innerHTML=hist.length?hist.map(h=>`<li><span class="q">${h.q}<br><small>${h.d}</small></span><span class="r">${h.t}</span></li>`).join("")
    :'<li class="nada">Todavía no tiraste</li>';
}
function agregar(c){
  if(dados.length>=30) return;
  dados.push({c,v:null,fijo:false});
  $("#total").hidden=true;
  pintaPaño(false);pintaControles();
}
$("#tipos").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  let c=b.dataset.c;
  if(c==="otro"){
    const r=prompt("¿Cuántas caras? (2 a 1000)","3");
    c=parseInt(r);if(!(c>=2&&c<=1000))return;
  }
  agregar(+c);
};
$("#rapidos").innerHTML=RAPIDOS.map(([t],i)=>`<button data-i="${i}">${t}</button>`).join("");
$("#rapidos").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  dados=RAPIDOS[b.dataset.i][1].map(c=>({c,v:null,fijo:false}));mod=0;
  $("#total").hidden=true;pintaPaño(false);pintaControles();
};
$("#limpiar").onclick=()=>{dados=[];mod=0;$("#total").hidden=true;pintaPaño(false);pintaControles()};
$("#sacar").onclick=()=>{dados.pop();pintaPaño(false);pintaControles()};
$("#soltar").onclick=()=>{dados.forEach(d=>d.fijo=false);pintaPaño(false);pintaControles()};
$("#mas").onclick=()=>{if(mod<99)mod++;pintaControles()};
$("#menos").onclick=()=>{if(mod>-99)mod--;pintaControles()};
$("#paño").onclick=e=>{
  const d=e.target.closest(".dado");if(!d)return;
  const x=dados[d.dataset.i];if(x.v==null)return;
  x.fijo=!x.fijo;pintaPaño(false);pintaControles();
};
$("#borrarHist").onclick=()=>{hist=[];guardar();pintaHist()};

function tirar(){
  if(!dados.length)return;
  dados.forEach(d=>{if(!d.fijo||d.v==null){d.v=azar(d.c);d.fijo=false}});
  pintaPaño(true);
  const suma=dados.reduce((s,d)=>s+d.v,0), total=suma+mod;
  $("#num").textContent=total;
  const vals=dados.map(d=>d.c===100?valorD100(d.v):d.v);
  $("#det").textContent=vals.join(" + ")+(mod?(mod>0?" + ":" − ")+Math.abs(mod):"");
  // Datos útiles: máximo, mínimo y repetidos (para Generala y similares)
  const extra=[];
  if(dados.length>1){
    const vs=dados.map(d=>d.v);
    extra.push("Mayor "+Math.max(...vs),"Menor "+Math.min(...vs));
    const rep={};vs.forEach(v=>rep[v]=(rep[v]||0)+1);
    const max=Math.max(...Object.values(rep));
    if(max>1&&dados.every(d=>d.c===dados[0].c)) extra.push(`${max} iguales`);
  }
  dados.forEach(d=>{if(d.c===20&&d.v===20)extra.push("¡20 natural!");if(d.c===20&&d.v===1&&!extra.includes("Pifia en d20"))extra.push("Pifia en d20")});
  $("#extra").innerHTML=extra.map(t=>`<span>${t}</span>`).join("");
  $("#total").hidden=false;
  hist.unshift({q:pedido(),d:$("#det").textContent,t:total});
  hist=hist.slice(0,30);guardar();pintaHist();pintaControles();
  if(navigator.vibrate)try{navigator.vibrate(40)}catch(e){}
}
$("#tirar").onclick=tirar;
document.addEventListener("keydown",e=>{if((e.key===" "||e.key==="Enter")&&e.target===document.body){e.preventDefault();tirar()}});

pintaControles();pintaHist();
</script>
</body>
</html>
